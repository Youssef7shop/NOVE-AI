<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ChatAI — Sign in</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ef9857'/%3E%3Cpath d='M9 12h14M9 16h14M9 20h9' stroke='%2315151a' stroke-width='2.3' stroke-linecap='round'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="auth-page">
  <div class="auth-glow auth-glow-a"></div>
  <div class="auth-glow auth-glow-b"></div>

  <div class="auth-card">
    <div class="auth-brand">
      <div class="brand-mark">A</div>
      <span class="brand-wordmark">ChatAI</span>
    </div>

    <h1 class="auth-title" id="formTitle">Welcome back</h1>
    <p class="auth-subtitle" id="formSubtitle">Sign in to continue to your workspace.</p>

    <div class="auth-error" id="authError"></div>

    <div class="oauth-list">
      <button class="btn btn-secondary btn-block oauth-btn" onclick="handleOAuth('Google')">
        <svg class="oauth-logo" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4c-7.7 0-14.4 4.4-17.7 10.7z"/><path fill="#4CAF50" d="M24 44c5.3 0 10.1-2 13.7-5.4l-6.3-5.3C29.4 34.9 26.8 36 24 36c-5.3 0-9.7-3.1-11.3-7.5l-6.6 5.1C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.2 5.6l6.3 5.3C40.9 36.6 44 30.9 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
        Continue with Google
      </button>
      <button class="btn btn-secondary btn-block oauth-btn" onclick="handleOAuth('Facebook')">
        <svg class="oauth-logo" viewBox="0 0 24 24"><path fill="#1877F2" d="M24 12.07C24 5.4 18.63 0 12 0S0 5.4 0 12.07C0 18.1 4.39 23.1 10.13 24v-8.44H7.08v-3.49h3.05V9.41c0-3.02 1.79-4.7 4.53-4.7 1.31 0 2.68.24 2.68.24v2.95h-1.5c-1.5 0-1.96.93-1.96 1.89v2.28h3.34l-.53 3.49h-2.8V24C19.62 23.1 24 18.1 24 12.07z"/></svg>
        Continue with Facebook
      </button>
      <button class="btn btn-secondary btn-block oauth-btn" onclick="handleOAuth('Apple')">
        <svg class="oauth-logo" viewBox="0 0 24 24"><path fill="#fff" d="M16.365 1.43c0 1.14-.42 2.06-1.26 2.87-.99.94-2.14 1.15-2.9 1.08-.06-1.1.42-2.2 1.2-2.95.85-.81 2.06-1.19 2.95-1.19.02.06.01.13-.01.19zM20.5 17.1c-.53 1.2-.78 1.74-1.46 2.79-.95 1.48-2.29 3.32-3.95 3.34-1.48.01-1.86-.96-3.87-.95-2.01.01-2.44.97-3.92.95-1.66-.02-2.93-1.68-3.88-3.15-2.66-4.11-2.94-8.93-1.3-11.5.98-1.55 2.63-2.53 4.24-2.53 1.64 0 2.67.99 4.02.99 1.31 0 2.11-1 4-1 1.36 0 2.8.74 3.83 2.02-3.37 1.85-2.82 6.66.29 8.04z"/></svg>
        Continue with Apple
      </button>
    </div>

    <div class="auth-divider">or</div>

    <form id="authForm" onsubmit="handleSubmit(event)">
      <div class="field" id="nameField" style="display:none;">
        <label for="fullName">Name</label>
        <input type="text" id="fullName" placeholder="Your name" autocomplete="name" />
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required minlength="6" />
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitBtn">Sign in</button>
    </form>

    <p class="auth-toggle" id="toggleWrap">
      Don't have an account? <button type="button" onclick="toggleMode()">Sign up</button>
    </p>

    <p class="auth-legal">Demo screen — accounts aren't saved yet. Phase 2 wires this up to real auth. See README.md.</p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="auth.js"></script>
</body>
</html>
