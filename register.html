<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Create Account — Niveau AI</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>


<body class="auth-body">


<div class="auth-card">

  <div class="auth-logo">
    N
  </div>

  <h1>Create your account</h1>

  <p class="auth-subtitle">
    Start building with Niveau AI
  </p>


  <form id="registerForm">


    <label>First name</label>

    <input
      id="firstName"
      type="text"
      placeholder="Haytam"
      required
    >


    <label>Last name</label>

    <input
      id="lastName"
      type="text"
      placeholder="Your last name"
      required
    >


    <label>Email</label>

    <input
      id="registerEmail"
      type="email"
      placeholder="you@example.com"
      required
    >


    <label>Password</label>

    <input
      id="registerPassword"
      type="password"
      minlength="6"
      placeholder="At least 6 characters"
      required
    >


    <button
      class="auth-button"
      type="submit"
    >
      Create account
    </button>

  </form>


  <div class="divider">
    <span>OR</span>
  </div>


  <button
    id="googleRegister"
    class="google-button"
  >
    Continue with Google
  </button>


  <p
    id="authMessage"
    class="auth-message"
  ></p>


  <p class="switch-auth">

    Already have an account?

    <a href="login.html">
      Login
    </a>

  </p>

</div>


<script src="auth.js"></script>


<script>

document
  .getElementById("registerForm")
  .addEventListener(
    "submit",
    async (event) => {

      event.preventDefault();


      const firstName =
        document.getElementById(
          "firstName"
        ).value.trim();


      const lastName =
        document.getElementById(
          "lastName"
        ).value.trim();


      const email =
        document.getElementById(
          "registerEmail"
        ).value.trim();


      const password =
        document.getElementById(
          "registerPassword"
        ).value;


      const message =
        document.getElementById(
          "authMessage"
        );


      message.textContent =
        "Creating your account...";


      try {

        const data =
          await registerUser(
            firstName,
            lastName,
            email,
            password
          );


        if (!data.session) {

          message.textContent =
            "Account created. Check your email to confirm your account.";

          return;

        }


        window.location.href =
          "index.html";

      }

      catch (error) {

        message.textContent =
          error.message;

      }

    }
  );


document
  .getElementById("googleRegister")
  .addEventListener(
    "click",
    async () => {

      try {

        await loginWithGoogle();

      }

      catch (error) {

        document
          .getElementById("authMessage")
          .textContent =
          error.message;

      }

    }
  );

</script>

</body>

</html>
